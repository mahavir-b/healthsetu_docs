<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HealthSetu Help & Training</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Client help, training, and how-to guides for HealthSetu — Core, RakhtSetu, SupplySetu, HRSetu, and CareSetu." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="stylesheet" href="styles/custom.css" />
</head>
<body>
  <div id="app">Loading HealthSetu Help…</div>
  <script>
    window.$docsify = {
      name: 'HealthSetu Help',
      repo: 'mahavir-b/healthsetu_docs',
      // Project Pages URL is https://mahavir-b.github.io/healthsetu_docs/
      basePath: location.pathname.indexOf('/healthsetu_docs') === 0 ? '/healthsetu_docs/' : '/',
      loadSidebar: true,
      subMaxLevel: 0,
      relativePath: false,
      auto2top: true,
      homepage: 'README.md',
      search: {
        paths: 'auto',
        placeholder: 'Search help…',
        noData: 'No matching topic',
        depth: 3
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
